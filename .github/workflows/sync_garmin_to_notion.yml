name: Sync Garmin to Notion

on:
  schedule:
    # This cron job will run every 15 minutes from 6 AM to 11 PM Eastern Time
    # - cron: '*/10 10-23 * * *'  # Every 15 minutes from 10:00 to 23:45 UTC 
    # - cron: '*/10 0-3 * * *'    # Every 15 minutes from 00:00 to 03:45 UTC
    - cron: '0 10 * * *'  # 12:00 Madrid
    - cron: '0 16 * * *'  # 18:00 Madrid
    - cron: '0 20 * * *'  # 22:00 Madrid
  workflow_dispatch:
env:
  TZ: 'Europe/Madrid'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          
      - name: Debug environment
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          python --version
          pip --version
          python -m pip show garminconnect
          python -m pip show notion-client
          python - <<'PY'
          import garminconnect
          import notion_client
          print("garminconnect imported version:", getattr(garminconnect, "__version__", "sin __version__"))
          print("notion_client imported version:", getattr(notion_client, "__version__", "sin __version__"))
          PY
          pip freeze | grep -E 'garminconnect|notion-client|garth'

      - name: Run script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_PR_DB_ID: ${{ secrets.NOTION_PR_DB_ID }}
          NOTION_STEPS_DB_ID: ${{ secrets.NOTION_STEPS_DB_ID }}
          NOTION_SLEEP_DB_ID: ${{ secrets.NOTION_SLEEP_DB_ID }}
          NOTION_EQ_DB_ID: ${{ secrets.NOTION_EQ_DB_ID }}
          NOTION_EX_DB_ID: ${{ secrets.NOTION_EX_DB_ID }}
          TZ: 'Europe/Madrid'
        run: |
          python garmin-activities.py
          python personal-records.py
          python daily-steps.py
          python sleep-data.py
          python garmin-equipment.py
